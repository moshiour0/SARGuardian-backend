name: Authorized Bhote Koshi raw-data baseline validation

on:
  push:
    branches:
      - validation/raw-baseline-20261029
    paths:
      - ".github/workflows/authorized-bhote-koshi-validation.yml"

permissions:
  contents: read
  actions: read

jobs:
  full-aoi-baseline:
    if: contains(github.event.head_commit.message, '[authorized-raw-validation]')
    uses: ./.github/workflows/sarguardian-aoi-wkt-dashboard.yml
    with:
      # Target-free AOI-wide Find Displacements; no crown or target polygon.
      aoi_wkt: "POLYGON ((84.99140223107368 28.499061219892724, 84.945606791564 28.28220804656594, 85.18844724834032 28.270753557383987, 85.20285565607317 28.414428221022945, 85.11305609453537 28.49639181334535, 84.99140223107368 28.499061219892724))"
      start_date: "2026-06-17"
      end_date: "2026-09-15"
      date_filter_mode: secondary-acquisition-in-window
      run_profile: full-aoi-baseline
      retention_profile: derived-only
      job_id: ""
      callback_url: ""
      request_fingerprint: ""
      place_name: "Bhote Koshi AOI — target-free validation"
      place_latitude: "28.38"
      place_longitude: "85.07"
      target_latitude: ""
      target_longitude: ""
    secrets: inherit

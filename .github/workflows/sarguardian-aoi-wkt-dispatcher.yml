name: SARGuardian AOI WKT E2E (safe branch dispatcher)

# This small default-branch entry point only calls the isolated feature workflow.
# It does not edit, replace, or invoke the existing source-AOI E2E workflow.
on:
  workflow_dispatch:
    inputs:
      aoi_wkt:
        description: "Single-ring WKT POLYGON in EPSG:4326; coordinates are longitude latitude. No holes or MULTIPOLYGON."
        required: true
        type: string
        default: "POLYGON ((84.99140223107368 28.499061219892724, 84.945606791564 28.28220804656594, 85.18844724834032 28.270753557383987, 85.20285565607317 28.414428221022945, 85.11305609453537 28.49639181334535, 84.99140223107368 28.499061219892724))"
      start_date:
        description: "Inclusive start date for secondary acquisition dates (YYYY-MM-DD); reference date may predate it."
        required: true
        type: string
        default: "2026-06-17"
      end_date:
        description: "Inclusive end date for secondary acquisition dates (YYYY-MM-DD)."
        required: true
        type: string
        default: "2026-09-15"
      date_filter_mode:
        description: "Default selects by secondary acquisition date; strict mode requires both pair acquisitions inside the interval."
        required: true
        type: choice
        options:
          - both-acquisitions-in-window
          - secondary-acquisition-in-window
        default: secondary-acquisition-in-window
      run_profile:
        description: "Start with validation pilot; full AOI baseline processes every matching catalog product."
        required: true
        type: choice
        options:
          - validation-pilot
          - full-aoi-baseline
        default: validation-pilot
      retention_profile:
        description: "Choose derived outputs only or retain a full lossless HDF5 archive as well."
        required: true
        type: choice
        options:
          - derived-only
          - full-lossless
        default: derived-only

permissions:
  contents: read
  actions: read

jobs:
  run-isolated-aoi-pipeline:
    name: Run AOI workflow from the isolated science-integration branch
    uses: moshiour0/SARGuardian-backend/.github/workflows/sarguardian-aoi-wkt-dashboard.yml@feat/final-aoi-science-integration
    with:
      aoi_wkt: ${{ inputs.aoi_wkt }}
      start_date: ${{ inputs.start_date }}
      end_date: ${{ inputs.end_date }}
      date_filter_mode: ${{ inputs.date_filter_mode }}
      run_profile: ${{ inputs.run_profile }}
      retention_profile: ${{ inputs.retention_profile }}
    secrets: inherit

name: Target 4/9 authenticated raw NISAR investigation

on:
  push:
    branches:
      - science/target4-9-raw-investigation
    paths:
      - ".github/workflows/target49-raw-science-investigation.yml"
      - "tools/target49_products.tsv"
      - "tools/summarize_target49_diagnostics.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: target49-raw-science-investigation
  cancel-in-progress: false

jobs:
  raw-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout isolated backend investigation branch
        uses: actions/checkout@v4

      - name: Checkout scientific diagnostic implementation
        uses: actions/checkout@v4
        with:
          repository: moshiour0/SARGuardian
          ref: 0f9b9328db4ddd14c38180d05e9dad9ca10f64cb
          path: scientific

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r scientific/requirements.txt

      - name: Validate diagnostic and downloader tooling before network calls
        run: |
          set -euo pipefail
          python -m pytest scientific/tests/test_target49_gate_diagnostic.py scientific/tests/test_target49_downloader.py scientific/tests/test_local_floor.py scientific/tests/test_scar_map.py -q
          python scientific/tools/download_target49_products.py --label GUNW-009-PROVISIONAL --dry-run

      - name: Require Earthdata credentials
        shell: bash
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${EARTHDATA_TOKEN:-}" && ( -z "${EARTHDATA_USERNAME:-}" || -z "${EARTHDATA_PASSWORD:-}" ) ]]; then
            echo "::error::Raw HDF5 investigation cannot run: configure EARTHDATA_TOKEN or both EARTHDATA_USERNAME and EARTHDATA_PASSWORD in SARGuardian-backend Actions secrets."
            exit 2
          fi
          echo "EARTHDATA_AUTH_CONFIGURED=yes" >> "$GITHUB_STEP_SUMMARY"
          echo "Credentials are available to the download step; secret values are never printed."

      - name: Download exact Run #55 products, diagnose both AOIs, and delete raw HDF5
        shell: bash
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          set -euo pipefail
          RAW_DIR="$RUNNER_TEMP/target49-one-at-a-time"
          OUT_DIR="$GITHUB_WORKSPACE/target49_diagnostic"
          PRODUCT_LIST="$GITHUB_WORKSPACE/tools/target49_products.tsv"
          mkdir -p "$RAW_DIR" "$OUT_DIR/download_manifests" "$OUT_DIR/diagnostics"
          ACTIVE_WORK=""

          cleanup_raw() {
            if [[ -n "${ACTIVE_WORK:-}" ]]; then
              rm -rf -- "$ACTIVE_WORK"
            fi
          }
          trap cleanup_raw EXIT

          while IFS='|' read -r PRODUCT MATURITY LABEL GRANULE; do
            [[ -z "${PRODUCT:-}" || "$PRODUCT" == "# product_type" ]] && continue
            echo "=== RAW_HDF5_DIAGNOSTIC_START label=$LABEL ==="
            STEM="${GRANULE%.h5}"
            WORK="$RAW_DIR/$STEM"
            ACTIVE_WORK="$WORK"
            MANIFEST="$OUT_DIR/download_manifests/$LABEL.json"
            rm -rf -- "$WORK"
            rm -f -- "$MANIFEST"

            attempt=1
            while ! python tools/download_nisar_product.py \
                --product-type "$PRODUCT" --maturity "$MATURITY" \
                --granule-name "$GRANULE" --science-root "$GITHUB_WORKSPACE/scientific" \
                --aoi source --out-dir "$WORK"; do
              rm -rf -- "$WORK"
              if (( attempt >= 4 )); then
                echo "::error::Download failed after 4 attempts: $LABEL ($GRANULE)"
                exit 1
              fi
              sleep_seconds=$((attempt * 15))
              echo "RETRYING_DOWNLOAD label=$LABEL attempt=$((attempt + 1)) sleep_seconds=$sleep_seconds"
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
            done

            RAW="$WORK/$GRANULE"
            SOURCE_MANIFEST="$WORK/download-manifest.json"
            if [[ ! -s "$RAW" || ! -s "$SOURCE_MANIFEST" ]]; then
              echo "::error::Downloader did not produce one verified HDF5 and manifest for $LABEL"
              exit 1
            fi
            cp -- "$SOURCE_MANIFEST" "$MANIFEST"

            python scientific/tools/target49_gate_diagnostic.py "$RAW" \
              --aoi source --out "$OUT_DIR/diagnostics/${LABEL}__source.json"
            python scientific/tools/target49_gate_diagnostic.py "$RAW" \
              --aoi langtang --out "$OUT_DIR/diagnostics/${LABEL}__langtang.json"

            if [[ "$PRODUCT" == "GUNW" ]]; then
              # Diagnostic-only sensitivities, not production output changes.
              python scientific/tools/target49_gate_diagnostic.py "$RAW" \
                --aoi source --no-iono --out "$OUT_DIR/diagnostics/${LABEL}__source_no_iono_gate.json"
              python scientific/tools/target49_gate_diagnostic.py "$RAW" \
                --aoi langtang --no-iono --out "$OUT_DIR/diagnostics/${LABEL}__langtang_no_iono_gate.json"
            fi

            rm -rf -- "$WORK"
            ACTIVE_WORK=""
            echo "RAW_HDF5_DELETED_AFTER_DIAGNOSTIC label=$LABEL"
            echo "=== RAW_HDF5_DIAGNOSTIC_COMPLETE label=$LABEL ==="
          done < "$PRODUCT_LIST"

      - name: Verify identity and summarize every diagnostic report
        run: |
          set -euo pipefail
          python tools/summarize_target49_diagnostics.py \
            --root "$GITHUB_WORKSPACE/target49_diagnostic" \
            --manifest "$GITHUB_WORKSPACE/tools/target49_products.tsv" \
            --expected-products 13

      - name: Upload only manifests and diagnostic summaries (never raw HDF5)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: target49-raw-science-diagnostic
          path: |
            target49_diagnostic/**
          if-no-files-found: warn
          retention-days: 14

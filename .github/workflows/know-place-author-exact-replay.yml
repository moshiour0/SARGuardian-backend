name: Know Place Analysis - exact author P05023 replay

# Raw HDF5 access requires an exact explicit [run-know-place] consent marker.
on:
  push:
    branches:
      - feat/know-place-analysis
    paths:
      - "tools/know_place/author_exact_acquisition.py"
      - "docs/know-place/reference/author_benchmark_v1.json"
      - ".github/workflows/know-place-author-exact-replay.yml"
  workflow_dispatch:
    inputs:
      consent_marker:
        description: "Enter exactly [run-know-place] to allow five raw GOFF downloads"
        required: false
        default: ""
        type: string
      geometry_height_m:
        description: "Exploratory geometry height in metres; not a datum correction"
        required: true
        default: "5151"
        type: string
      control_draws:
        description: "Deterministic exploratory control draws"
        required: true
        default: "1000"
        type: string
      seed:
        description: "Deterministic exploratory seed"
        required: true
        default: "260826"
        type: string

permissions:
  contents: read

concurrency:
  group: know-place-author-exact-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  trigger-gate:
    name: Require explicit consent before any raw source operation
    runs-on: ubuntu-24.04
    outputs:
      run_author_exact: ${{ steps.decide.outputs.run_author_exact }}
    steps:
      - name: Evaluate explicit consent without touching science data
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          MANUAL_CONSENT_MARKER: ${{ github.event.inputs.consent_marker || '' }}
        run: |
          set -euo pipefail
          run_author_exact=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_CONSENT_MARKER" == "[run-know-place]" ]]; then
            run_author_exact=true
          elif [[ "$EVENT_NAME" == "push" && "$HEAD_COMMIT_MESSAGE" == *"[run-know-place]"* ]]; then
            run_author_exact=true
          fi
          echo "run_author_exact=$run_author_exact" >> "$GITHUB_OUTPUT"
          if [[ "$run_author_exact" != "true" ]]; then
            echo "No exact [run-know-place] consent marker was supplied; no CMR query, download, analysis or Drive upload occurred." >> "$GITHUB_STEP_SUMMARY"
            echo "AUTHOR_EXACT_RUN=SKIPPED_NO_EXPLICIT_CONSENT"
            echo "RAW_SOURCE_DOWNLOADS=0"
          else
            echo "AUTHOR_EXACT_RUN=EXPLICIT_CONSENT_CONFIRMED"
          fi

  acquire-analyze-retain:
    name: Acquire exact five P05023 HDF5 products, hash, analyse, retain derived results
    needs: trigger-gate
    if: needs.trigger-gate.outputs.run_author_exact == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}

    steps:
      - name: Prepare run paths and check credentials before source acquisition
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT="$RUNNER_TEMP/know-place-author-exact"
          DERIVED_ROOT="$RUN_ROOT/derived"
          echo "RUN_ROOT=$RUN_ROOT" >> "$GITHUB_ENV"
          echo "DERIVED_ROOT=$DERIVED_ROOT" >> "$GITHUB_ENV"
          umask 077
          mkdir -p "$RUN_ROOT" "$DERIVED_ROOT"
          chmod 700 "$RUN_ROOT" "$DERIVED_ROOT"
          if [[ -z "$GOOGLE_DRIVE_OAUTH_CLIENT_JSON" || -z "$GOOGLE_DRIVE_REFRESH_TOKEN" || -z "$GOOGLE_DRIVE_PARENT_FOLDER_ID" ]]; then
            echo "secrets_ready=false" >> "$GITHUB_OUTPUT"
            echo "ERROR=DRIVE_SECRETS_REQUIRED_BEFORE_RAW_DOWNLOAD"
            exit 0
          fi
          if [[ -z "$EARTHDATA_TOKEN" && ( -z "$EARTHDATA_USERNAME" || -z "$EARTHDATA_PASSWORD" ) ]]; then
            echo "secrets_ready=false" >> "$GITHUB_OUTPUT"
            echo "ERROR=EARTHDATA_TOKEN_OR_USERNAME_PASSWORD_REQUIRED"
            exit 0
          fi
          echo "secrets_ready=true" >> "$GITHUB_OUTPUT"
          echo "CREDENTIAL_PREFLIGHT=PASS"
          echo "RAW_DOWNLOAD_CONSENT=PASS"

      - name: Checkout backend at exact triggering commit
        if: steps.credentials.outputs.secrets_ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Checkout pinned science acquisition helper
        if: steps.credentials.outputs.secrets_ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: moshiour0/SARGuardian
          ref: 10639a916c9829850775410b3ed7de62e527770d
          path: science-source

      - name: Set up Python 3.13
        if: steps.credentials.outputs.secrets_ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install pinned analysis and retention dependencies
        if: steps.credentials.outputs.secrets_ready == 'true'
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r tools/know_place/requirements.txt -r tools/requirements-retention.txt

      - name: Query exact CMR records, preflight authenticated URLs, download and analyse
        id: analysis
        if: steps.credentials.outputs.secrets_ready == 'true'
        continue-on-error: true
        shell: bash
        env:
          RUN_GEOMETRY_HEIGHT_M: ${{ github.event.inputs.geometry_height_m || '5151' }}
          RUN_CONTROL_DRAWS: ${{ github.event.inputs.control_draws || '1000' }}
          RUN_SEED: ${{ github.event.inputs.seed || '260826' }}
        run: python -m tools.know_place.author_exact_acquisition --operation download-and-analyze --out-root "$RUN_ROOT" --science-root "$GITHUB_WORKSPACE/science-source" --consent-marker "[run-know-place]" --geometry-height-m "$RUN_GEOMETRY_HEIGHT_M" --control-draws "$RUN_CONTROL_DRAWS" --seed "$RUN_SEED"

      - name: Write failure receipt if acquisition stops before derived evidence
        if: always()
        shell: bash
        env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          SECRETS_READY: ${{ steps.credentials.outputs.secrets_ready }}
        run: |
          set -euo pipefail
          mkdir -p "$DERIVED_ROOT"
          if [[ -z "$(find "$DERIVED_ROOT" -maxdepth 1 -type f -print -quit)" ]]; then
            python - "$DERIVED_ROOT/author-exact-workflow-failure.json" "$ANALYSIS_OUTCOME" "$SECRETS_READY" "$GITHUB_RUN_ID" "$GITHUB_SHA" <<'PY'
          import json,sys,datetime
          path,outcome,secrets_ready,run_id,sha=sys.argv[1:]
          value={"schema_version":"know-place-author-exact-workflow-failure/1.0","created_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"analysis_step_outcome":outcome,"secrets_ready":secrets_ready=="true","workflow_run_id":run_id,"backend_commit":sha,"source_downloads":0,"paper_reproduction_status":"BLOCKED_RAW_GOFF_BYTES_AND_IMPLEMENTATION_PARITY_UNVERIFIED","hazard_detection_status":"NOT_EVALUATED"}
          with open(path,"w",encoding="utf-8") as stream:
              json.dump(value,stream,indent=2); stream.write("\n")
          PY
          fi

      - name: Package derived outputs only and reject raw HDF5
        id: bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - "$DERIVED_ROOT" <<'PY'
          from pathlib import Path
          import sys,zipfile
          root=Path(sys.argv[1]).resolve()
          target=root/"author-exact-derived-results.zip"
          files=sorted(p for p in root.rglob("*") if p.is_file() and p != target and p.name not in {"drive-upload-receipt.json","drive-receipt-upload.json"})
          if not files:
              raise SystemExit("ERROR=AUTHOR_EXACT_DERIVED_OUTPUT_EMPTY")
          if any(p.suffix.lower() in {".h5",".hdf5"} for p in files):
              raise SystemExit("ERROR=RAW_HDF5_PRESENT_IN_DERIVED_OUTPUT")
          with zipfile.ZipFile(target,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=6) as archive:
              for path in files:
                  archive.write(path,path.relative_to(root))
          print("AUTHOR_EXACT_DERIVED_BUNDLE_BYTES="+str(target.stat().st_size))
          print("RAW_HDF5_IN_BUNDLE=0")
          PY

      - name: Upload derived bundle and receipts to private Google Drive
        id: drive_upload
        if: always() && steps.bundle.outcome == 'success' && steps.credentials.outputs.secrets_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/drive_resumable_upload.py --root "$DERIVED_ROOT" --run-name "KnowPlaceAuthorExact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --files "$DERIVED_ROOT/author-exact-derived-results.zip" --out "$DERIVED_ROOT/drive-upload-receipt.json"
          test -s "$DERIVED_ROOT/drive-upload-receipt.json"
          python tools/drive_resumable_upload.py --root "$DERIVED_ROOT" --run-name "KnowPlaceAuthorExact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --files "$DERIVED_ROOT/drive-upload-receipt.json" --out "$DERIVED_ROOT/drive-receipt-upload.json"
          python - "$DERIVED_ROOT/drive-upload-receipt.json" "$DERIVED_ROOT/drive-receipt-upload.json" <<'PY'
          import json,sys
          first,second=[json.load(open(path,encoding="utf-8")) for path in sys.argv[1:]]
          for receipt in (first,second):
              if receipt.get("remote_verification")!="PASS" or receipt.get("raw_product_uploaded") is not False:
                  raise SystemExit("ERROR=AUTHOR_EXACT_DRIVE_RETENTION_NOT_VERIFIED")
          print("AUTHOR_EXACT_DRIVE_RETENTION=PASS")
          print("RAW_PRODUCT_UPLOADED=false")
          PY

      - name: Remove temporary raw HDF5 only after verified Drive retention
        if: steps.drive_upload.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - "$DERIVED_ROOT/drive-upload-receipt.json" "$DERIVED_ROOT/drive-receipt-upload.json" <<'PY'
          import json,sys
          first,second=[json.load(open(path,encoding="utf-8")) for path in sys.argv[1:]]
          if any(item.get("remote_verification")!="PASS" or item.get("raw_product_uploaded") is not False for item in (first,second)):
              raise SystemExit("ERROR=REFUSING_RAW_CLEANUP_WITHOUT_VERIFIED_DRIVE_RECEIPTS")
          PY
          RAW_DIR="$RUN_ROOT/source-run/raw"
          if [[ -d "$RAW_DIR" ]]; then
            find "$RAW_DIR" -maxdepth 1 -type f -name '*.h5' -delete
            find "$RAW_DIR" -maxdepth 1 -type f -name '*.H5' -delete
            rmdir "$RAW_DIR" 2>/dev/null || true
          fi
          echo "RAW_HDF5_REMOVED_AFTER_DURABLE_DRIVE_VERIFICATION=true"

      - name: Preserve derived outputs and receipts as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: know-place-author-exact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/know-place-author-exact/derived/**
          if-no-files-found: warn
          retention-days: 30

      - name: Final scientific and retention gate
        if: always()
        shell: bash
        env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          SECRETS_READY: ${{ steps.credentials.outputs.secrets_ready }}
        run: |
          set -euo pipefail
          if [[ "$SECRETS_READY" != "true" ]]; then
            echo "ERROR=RAW_REPLAY_CREDENTIAL_PREFLIGHT_FAILED"
            exit 1
          fi
          if [[ "$ANALYSIS_OUTCOME" != "success" ]]; then
            echo "ERROR=AUTHOR_EXACT_ANALYSIS_STEP_FAILED"
            exit 1
          fi
          python - "$DERIVED_ROOT/author-exact-analysis-status.json" "$DERIVED_ROOT/know-place-analysis-report.json" "$DERIVED_ROOT/author-exact-source-manifest.json" "$DERIVED_ROOT/drive-upload-receipt.json" "$DERIVED_ROOT/drive-receipt-upload.json" <<'PY'
          import json,sys
          status_path,report_path,source_path,drive1_path,drive2_path=sys.argv[1:]
          status,report,source,drive1,drive2=[json.load(open(path,encoding="utf-8")) for path in (status_path,report_path,source_path,drive1_path,drive2_path)]
          if status.get("status")!="OUTPUTS_WRITTEN" or status.get("analysis_metrics_complete") is not True:
              raise SystemExit("ERROR=AUTHOR_EXACT_METRICS_NOT_COMPLETE")
          if report.get("structural_status")!="PASS" or report.get("status")!="SCIENTIFIC_METRICS_COMPUTED":
              raise SystemExit("ERROR=AUTHOR_EXACT_REPORT_GATE_FAILED")
          products=source.get("products",[])
          if source.get("status")!="PASS_FIVE_EXACT_HDF5_DOWNLOADED_HASHED_AND_GRID_VALIDATED" or len(products)!=5:
              raise SystemExit("ERROR=AUTHOR_EXACT_SOURCE_MANIFEST_GATE_FAILED")
          if any(p.get("release_id")!="P05023" or p.get("download_status")!="PASS" or not p.get("source_sha256") for p in products):
              raise SystemExit("ERROR=AUTHOR_SOURCE_HASH_RECEIPT_MISSING")
          if source.get("source_downloads")!=5 or source.get("author_exact_source_sha256_count")!=5:
              raise SystemExit("ERROR=AUTHOR_SOURCE_DOWNLOAD_HASH_COUNT_MISMATCH")
          for receipt in (drive1,drive2):
              if receipt.get("remote_verification")!="PASS" or receipt.get("raw_product_uploaded") is not False:
                  raise SystemExit("ERROR=AUTHOR_EXACT_DRIVE_RETENTION_NOT_VERIFIED")
          if report.get("paper_reproduction_status")!="BLOCKED_RAW_GOFF_BYTES_AND_IMPLEMENTATION_PARITY_UNVERIFIED":
              raise SystemExit("ERROR=PAPER_PARITY_MUST_REMAIN_BLOCKED")
          if report.get("hazard_detection_status")!="NOT_EVALUATED":
              raise SystemExit("ERROR=HAZARD_DETECTION_MUST_REMAIN_NOT_EVALUATED")
          print("AUTHOR_EXACT_MEASUREMENT_STATUS=PASS")
          print("PAPER_REPRODUCTION_STATUS=BLOCKED_RAW_GOFF_BYTES_AND_IMPLEMENTATION_PARITY_UNVERIFIED")
          print("HAZARD_DETECTION_STATUS=NOT_EVALUATED")
          print("AUTHOR_EXACT_DRIVE_RETENTION=PASS")
          PY
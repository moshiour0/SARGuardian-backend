name: SARGuardian AOI live catalog discovery diagnostic

on:
  push:
    branches:
      - feat/e2e-aoi-wkt-date-dashboard
    paths:
      - ".github/workflows/sarguardian-aoi-live-discovery-check.yml"
  workflow_dispatch:
    inputs:
      aoi_wkt:
        description: "One WGS84 polygon ring; longitude latitude."
        type: string
        required: true
        default: "POLYGON ((84.99140223107368 28.499061219892724, 84.945606791564 28.28220804656594, 85.18844724834032 28.270753557383987, 85.20285565607317 28.414428221022945, 85.11305609453537 28.49639181334535, 84.99140223107368 28.499061219892724))"
      start_date:
        description: "Inclusive secondary acquisition date (YYYY-MM-DD)."
        type: string
        required: true
        default: "2026-06-17"
      end_date:
        description: "Inclusive secondary acquisition date (YYYY-MM-DD)."
        type: string
        required: true
        default: "2026-09-15"

permissions:
  contents: read

jobs:
  catalog-only:
    name: Check AOI catalog coverage (no downloads)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SARGUARDIAN_AOI_WKT: ${{ inputs.aoi_wkt || 'POLYGON ((84.99140223107368 28.499061219892724, 84.945606791564 28.28220804656594, 85.18844724834032 28.270753557383987, 85.20285565607317 28.414428221022945, 85.11305609453537 28.49639181334535, 84.99140223107368 28.499061219892724))' }}
      START_DATE: ${{ inputs.start_date || '2026-06-17' }}
      END_DATE: ${{ inputs.end_date || '2026-09-15' }}
    steps:
      - name: Checkout isolated AOI orchestration branch
        uses: actions/checkout@v4
        with:
          ref: feat/e2e-aoi-wkt-date-dashboard

      - name: Checkout pinned scientific WKT parser
        uses: actions/checkout@v4
        with:
          repository: moshiour0/SARGuardian
          ref: 39e5a4991fe7bdb0f7a3ae41e5f38c1ba5dc53eb
          path: science-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install discovery dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r science-source/requirements.txt
          python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r tools/requirements-retention.txt

      - name: Query ASF and keep full discovery diagnostics
        id: discover
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          root="$RUNNER_TEMP/sarguardian-aoi-diagnostic"
          mkdir -p "$root"
          echo "AOI_DIAGNOSTIC_START_DATE=$START_DATE"
          echo "AOI_DIAGNOSTIC_END_DATE=$END_DATE"
          echo "AOI_DIAGNOSTIC_PROFILE=full-aoi-baseline"
          echo "AOI_DIAGNOSTIC_RETENTION=derived-only"
          python tools/discover_aoi_products.py \
            --science-root "$PWD/science-source" \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --run-profile full-aoi-baseline \
            --retention-profile derived-only \
            --out "$root/manifest.json" 2>&1 | tee "$root/discovery.log"
          rc=${PIPESTATUS[0]}
          echo "AOI_DIAGNOSTIC_EXIT_CODE=$rc" | tee -a "$root/discovery.log"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Compare custom AOI with known research AOI and no-geometry catalog controls
        if: always()
        shell: bash
        env:
          CONTROL_AOI_WKT: "POLYGON ((85.46451876449485 28.345047192655944, 85.46623537826439 28.277644183693493, 85.48958132553001 28.247707190492925, 85.53558657455345 28.245287672353218, 85.55618593978782 28.260106359331573, 85.55069277572532 28.290342185190823, 85.54931948470970 28.311199899644855, 85.53558657455345 28.330240328302096, 85.51018069076439 28.340212525080158, 85.49644778060814 28.352903058100104, 85.46451876449485 28.345047192655944))"
        run: |
          python - <<'PY'
          import json, os
          import requests
          url = "https://api.daac.asf.alaska.edu/services/search/param"
          start = "2024-01-01T00:00:00Z"
          end = os.environ["END_DATE"] + "T23:59:59Z"
          base = {"output": "json", "maxResults": "50", "dataset": "NISAR", "platform": "NISAR", "start": start, "end": end}
          cases = [
            ("custom_gunw_shortname", {**base, "intersectsWith": os.environ["SARGUARDIAN_AOI_WKT"], "shortName": "NISAR_L2_GUNW_V1"}),
            ("custom_goff_shortname", {**base, "intersectsWith": os.environ["SARGUARDIAN_AOI_WKT"], "shortName": "NISAR_L2_GOFF_V1"}),
            ("known_research_aoi_gunw_shortname", {**base, "intersectsWith": os.environ["CONTROL_AOI_WKT"], "shortName": "NISAR_L2_GUNW_V1"}),
            ("known_research_aoi_goff_shortname", {**base, "intersectsWith": os.environ["CONTROL_AOI_WKT"], "shortName": "NISAR_L2_GOFF_V1"}),
            ("no_geometry_gunw_shortname", {**base, "shortName": "NISAR_L2_GUNW_V1"}),
            ("no_geometry_goff_shortname", {**base, "shortName": "NISAR_L2_GOFF_V1"}),
            ("no_geometry_legacy_levels", {k:v for k,v in {**base, "processingLevel": "GUNW,GOFF,RUNW,ROFF,RIFG"}.items() if k != "dataset"}),
          ]
          with requests.Session() as session:
            for label, params in cases:
              try:
                response = session.get(url, params=params, timeout=(20, 90))
                response.raise_for_status()
                payload = response.json()
                if isinstance(payload, list):
                  rows = payload
                  keys = "list"
                elif isinstance(payload, dict):
                  rows = payload.get("results", payload.get("features", []))
                  keys = ",".join(sorted(payload.keys()))
                else:
                  rows = []
                  keys = type(payload).__name__
                names = []
                for row in rows if isinstance(rows, list) else []:
                  if not isinstance(row, dict): continue
                  props = row.get("properties") if isinstance(row.get("properties"), dict) else {}
                  name = row.get("granuleName") or row.get("granule_name") or row.get("Granule Name") or row.get("fileName") or row.get("sceneName") or props.get("granuleName") or props.get("granule_name") or props.get("fileName")
                  if name: names.append(str(name))
                first = rows[0] if isinstance(rows, list) and rows else None
                first_keys = sorted(first.keys()) if isinstance(first, dict) else []
                nested_first = first[0] if isinstance(first, list) and first else None
                nested_first_keys = sorted(nested_first.keys()) if isinstance(nested_first, dict) else []
                safe_sample = {}
                if isinstance(first, dict):
                  safe_sample = {k:v for k,v in list(first.items())[:12] if not any(s in str(k).lower() for s in ("url","download","token","password","secret","link","cookie"))}
                elif isinstance(nested_first, dict):
                  safe_sample = {k:v for k,v in list(nested_first.items())[:12] if not any(s in str(k).lower() for s in ("url","download","token","password","secret","link","cookie"))}
                print("ASF_CONTROL_QUERY " + json.dumps({"case":label,"status":response.status_code,"rows":len(rows) if isinstance(rows,list) else -1,"root_keys":keys,"first_type":type(first).__name__ if first is not None else None,"first_len":len(first) if isinstance(first,(list,dict)) else None,"nested_first_type":type(nested_first).__name__ if nested_first is not None else None,"nested_first_keys":nested_first_keys,"first_keys":first_keys,"first_sample":safe_sample if first is not None else None,"sample_names":names[:3]},separators=(",",":")))
              except Exception as exc:
                status = getattr(getattr(exc,"response",None),"status_code",None)
                print("ASF_CONTROL_QUERY " + json.dumps({"case":label,"error":type(exc).__name__,"http_status":status},separators=(",",":")))
          PY
      - name: Write diagnosis summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AOI live catalog discovery"
            echo
            echo "- Date window: $START_DATE through $END_DATE (inclusive secondary date)"
            echo "- Profile: full-aoi-baseline"
            echo "- This diagnostic performs catalog search only; it does not download or process products."
            echo
            if [ -f "$RUNNER_TEMP/sarguardian-aoi-diagnostic/discovery.log" ]; then
              echo "### Catalog filter counts / error"
              grep -E '^(ASF_CATALOG_RESPONSE|ASF_CATALOG_FALLBACK|AOI_DISCOVERY_COUNTS|AOI_WKT_SHA256|AOI_DISCOVERY_INVENTORY|AOI_PRODUCTS_SELECTED|ERROR=|AOI_DIAGNOSTIC_EXIT_CODE)' "$RUNNER_TEMP/sarguardian-aoi-diagnostic/discovery.log" || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw diagnostics and manifest if found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarguardian-aoi-live-discovery-diagnostic
          path: |
            ${{ runner.temp }}/sarguardian-aoi-diagnostic/discovery.log
            ${{ runner.temp }}/sarguardian-aoi-diagnostic/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve failure status when discovery fails
        if: steps.discover.outcome == 'failure'
        run: exit 1

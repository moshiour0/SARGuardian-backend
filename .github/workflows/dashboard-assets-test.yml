name: Dashboard asset builder tests

on:
  push:
    branches:
      - feat/interactive-geospatial-dashboard-main-integration
    paths:
      - "dashboard/**"
      - "tools/aggregate_aoi_run.py"
      - ".github/workflows/dashboard-assets-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "tools/aggregate_aoi_run.py"
      - ".github/workflows/dashboard-assets-test.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-assets-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dashboard-assets:
    name: Dashboard asset builder unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install geospatial test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy rasterio matplotlib pillow

      - name: Compile aggregator and asset builder
        run: python -m py_compile tools/aggregate_aoi_run.py dashboard/assets/prepare_web_assets.py

      - name: Syntax-check the interactive viewer JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("dashboard/assets/prepare_web_assets.py").read_text(encoding="utf-8")
          marker = "page = r'''"
          start = source.find(marker)
          if start < 0:
              raise SystemExit("ERROR=DASHBOARD_HTML_TEMPLATE_NOT_FOUND")
          start += len(marker)
          end = source.find("'''", start)
          if end < 0:
              raise SystemExit("ERROR=DASHBOARD_HTML_TEMPLATE_UNTERMINATED")
          html = source[start:end]
          script_start = html.rfind("<script>")
          if script_start < 0:
              raise SystemExit("ERROR=DASHBOARD_INLINE_SCRIPT_NOT_FOUND")
          script_start += len("<script>")
          script_end = html.find("</script>", script_start)
          if script_end < 0:
              raise SystemExit("ERROR=DASHBOARD_INLINE_SCRIPT_UNTERMINATED")
          Path("/tmp/sarguardian-dashboard.js").write_text(html[script_start:script_end], encoding="utf-8")
          PY
          node --check /tmp/sarguardian-dashboard.js

      - name: Test georeferenced layers, CRS handling, STAC paths and source immutability
        env:
          PYTHONPATH: .
        run: python -m unittest dashboard.tests.test_prepare_web_assets -v

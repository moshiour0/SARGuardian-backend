name: SARGuardian Retention Pilot (single granule, non-destructive)

# This is an evidence-gathering pilot, NOT the public multi-user job queue.
# It intentionally has no raw-deletion step. A real GUNW and GOFF run must
# pass archive verification and reader equivalence before any deletion logic
# can be designed or enabled.
on:
  workflow_dispatch:
    inputs:
      granule_name:
        description: Exact NISAR L2 granule name from ASF (no wildcard; .h5 optional)
        required: true
        type: string
      product_type:
        description: Product family
        required: true
        type: choice
        options: [GUNW, GOFF]
      maturity:
        description: ASF collection maturity
        required: true
        type: choice
        options: [PROVISIONAL, BETA]
      expected_source_bytes:
        description: Optional exact size estimate in bytes from ASF metadata if Earthaccess does not expose it
        required: false
        default: '0'
        type: string
      aoi:
        description: Test AOI (the granule must actually intersect the AOI)
        required: true
        type: choice
        options: [source, langtang, lhende]
      retention_profile:
        description: Dataset retention policy
        required: true
        type: choice
        options: [engine-ready, full-lossless]
        default: engine-ready
      include_wrapped:
        description: In engine-ready mode, also retain the entire high-posting wrappedInterferogram grid family in GUNW
        required: false
        default: false
        type: boolean
      derive_wrapped_phase:
        description: Additionally derive a phase-only wrappedPhase array in radians (not spatial unwrapping)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# This pilot permits one active retention experiment at a time. It is not a
# durable queue: do not use this workflow as a public job-submission endpoint.
concurrency:
  group: sarguardian-nisar-data-processing
  cancel-in-progress: false

jobs:
  retain-one-granule:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
      GRANULE_NAME: ${{ inputs.granule_name }}
      PRODUCT_TYPE: ${{ inputs.product_type }}
      MATURITY: ${{ inputs.maturity }}
      EXPECTED_SOURCE_BYTES: ${{ inputs.expected_source_bytes }}
      AOI_NAME: ${{ inputs.aoi }}
      INCLUDE_WRAPPED: ${{ inputs.include_wrapped }}
      RETENTION_PROFILE: ${{ inputs.retention_profile }}
      DERIVE_WRAPPED_PHASE: ${{ inputs.derive_wrapped_phase }}

    steps:
      - name: Checkout retention orchestration code
        uses: actions/checkout@v4

      - name: Checkout pinned SARGuardian scientific engine
        uses: actions/checkout@v4
        with:
          repository: moshiour0/SARGuardian
          ref: 77cc9646cfa46d3aff3669d351912f984cf67aa3
          path: science-source

      - name: Verify pinned science revision
        id: science_source
        shell: bash
        run: |
          set -euo pipefail
          expected='77cc9646cfa46d3aff3669d351912f984cf67aa3'
          actual="$(git -C science-source rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "SCIENCE_REVISION_VERIFIED=$actual"
          echo "science_commit=$actual" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned science and retention dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -r science-source/requirements.txt
          python -m pip install --disable-pip-version-check --no-cache-dir -r tools/requirements-retention.txt

      - name: Validate inputs and prepare private temp directories
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, sys
          name = os.environ['GRANULE_NAME'].strip()
          if name.lower().endswith('.h5'):
              name = name[:-3]
          if not re.fullmatch(r'NISAR_L2_(?:(?:PR|UR|OD)_)?(GUNW|GOFF)_[A-Za-z0-9_.-]{10,250}', name):
              raise SystemExit('ERROR=GRANULE_NAME_FORMAT_INVALID')
          if f"_{os.environ['PRODUCT_TYPE']}_" not in name:
              raise SystemExit('ERROR=GRANULE_NAME_PRODUCT_TYPE_MISMATCH')
          if os.environ['EXPECTED_SOURCE_BYTES']:
              try: size = int(os.environ['EXPECTED_SOURCE_BYTES'])
              except ValueError: raise SystemExit('ERROR=EXPECTED_SOURCE_BYTES_INVALID')
              if size < 0: raise SystemExit('ERROR=EXPECTED_SOURCE_BYTES_INVALID')
          print('INPUT_VALIDATION=PASS')
          PY
          root="$RUNNER_TEMP/sarguardian-retention"
          mkdir -p "$root/raw" "$root/curated"
          chmod 700 "$root" "$root/raw" "$root/curated"
          echo "raw_dir=$root/raw" >> "$GITHUB_OUTPUT"
          echo "curated_dir=$root/curated" >> "$GITHUB_OUTPUT"
          # Do not echo granule parameters, credentials, AOI or authenticated URLs.

      - name: Search and download exactly one product
        id: download
        shell: bash
        env:
          RAW_DIR: ${{ steps.paths.outputs.raw_dir }}
        run: |
          set -euo pipefail
          args=(--product-type "$PRODUCT_TYPE" --maturity "$MATURITY" --granule-name "$GRANULE_NAME" --out-dir "$RAW_DIR")
          if [[ "$EXPECTED_SOURCE_BYTES" =~ ^[0-9]+$ ]] && [[ "$EXPECTED_SOURCE_BYTES" -gt 0 ]]; then
            args+=(--expected-source-bytes "$EXPECTED_SOURCE_BYTES")
          fi
          log="$RUNNER_TEMP/sarguardian-download.log"
          python tools/download_nisar_product.py "${args[@]}" | tee "$log"
          raw_path="$(sed -n 's/^RAW_PRODUCT_PATH=//p' "$log" | tail -n 1)"
          test -n "$raw_path" && test -f "$raw_path"
          echo "raw_path=$raw_path" >> "$GITHUB_OUTPUT"

      - name: Preflight science-grid intersection before expensive archive work
        id: aoi_preflight
        shell: bash
        env:
          RAW_PATH: ${{ steps.download.outputs.raw_path }}
          CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
          SCIENCE_COMMIT: ${{ steps.science_source.outputs.science_commit }}
        run: |
          set -euo pipefail
          python tools/validate_product_aoi.py \
            --input "$RAW_PATH" --product-type "$PRODUCT_TYPE" --aoi "$AOI_NAME" \
            --science-root "$PWD/science-source" --science-commit "$SCIENCE_COMMIT" \
            --out "$CURATED_DIR/preflight-report.json"

      - name: Inventory every HDF5 dataset and attribute
        shell: bash
        env:
          RAW_PATH: ${{ steps.download.outputs.raw_path }}
          CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
        run: |
          set -euo pipefail
          python tools/sarguardian_hdf5_archive.py inventory \
            --input "$RAW_PATH" --product-type "$PRODUCT_TYPE" \
            --out "$CURATED_DIR/source-inventory.json"

      - name: Build conservative lossless retained-data HDF5
        id: archive
        shell: bash
        env:
          RAW_PATH: ${{ steps.download.outputs.raw_path }}
          CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
        run: |
          set -euo pipefail
          stem="${RAW_PATH##*/}"
          stem="${stem%.*}"
          archive="$CURATED_DIR/${stem}.science.h5"
          manifest="$CURATED_DIR/${stem}.retention-manifest.json"
          args=(archive --input "$RAW_PATH" --out "$archive" --manifest "$manifest" --product-type "$PRODUCT_TYPE" --retention-profile "$RETENTION_PROFILE")
          if [[ "$INCLUDE_WRAPPED" == "true" ]]; then args+=(--include-wrapped); fi
          if [[ "$DERIVE_WRAPPED_PHASE" == "true" ]]; then args+=(--derive-wrapped-phase); fi
          echo "ARCHIVE_BUILD_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python tools/sarguardian_hdf5_archive.py "${args[@]}"
          # archive command includes complete local logical-value/checksum verification.
          # Re-running its full source/archive scan here doubled the expensive I/O.
          echo "ARCHIVE_BUILD_FINISHED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "archive_path=$archive" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$manifest" >> "$GITHUB_OUTPUT"

      - name: Compare actual main-engine reader outputs against retained HDF5
        id: reader_equivalence
        shell: bash
        env:
          RAW_PATH: ${{ steps.download.outputs.raw_path }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.archive_path }}
          CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
          SCIENCE_COMMIT: ${{ steps.science_source.outputs.science_commit }}
        run: |
          set -euo pipefail
          python tools/verify_reader_equivalence.py \
            --product-type "$PRODUCT_TYPE" --source "$RAW_PATH" --archive "$ARCHIVE_PATH" \
            --science-root "$PWD/science-source" --science-commit "$SCIENCE_COMMIT" --aoi "$AOI_NAME" \
            --preflight-report "$CURATED_DIR/preflight-report.json" \
            --out "$CURATED_DIR/reader-equivalence.json"

      - name: Upload curated data and provenance to Google Drive (resumable, remote size+MD5 verification)
        id: drive_archive
        shell: bash
        env:
          RAW_PATH: ${{ steps.download.outputs.raw_path }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.archive_path }}
          MANIFEST_PATH: ${{ steps.archive.outputs.manifest_path }}
          CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
          RAW_DIR: ${{ steps.paths.outputs.raw_dir }}
        run: |
          set -euo pipefail
          cp "$RAW_DIR/download-manifest.json" "$CURATED_DIR/download-manifest.json"
          # Explicit allowlist: the raw source path is deliberately never passed.
          python tools/drive_resumable_upload.py \
            --root "$CURATED_DIR" --product-type "$PRODUCT_TYPE" --maturity "$MATURITY" \
            --granule-name "$GRANULE_NAME" \
            --files \
              "$ARCHIVE_PATH" \
              "$MANIFEST_PATH" \
              "$CURATED_DIR/source-inventory.json" \
              "$CURATED_DIR/preflight-report.json" \
              "$CURATED_DIR/reader-equivalence.json" \
              "$CURATED_DIR/download-manifest.json" \
            --out "$CURATED_DIR/drive-retention-receipt.json"
          # Persist the receipt itself remotely only after its referenced files are verified.
          python tools/drive_resumable_upload.py \
            --root "$CURATED_DIR" --product-type "$PRODUCT_TYPE" --maturity "$MATURITY" \
            --granule-name "$GRANULE_NAME" \
            --files "$CURATED_DIR/drive-retention-receipt.json" \
            --out "$CURATED_DIR/drive-receipt-upload-receipt.json"
          echo "DRIVE_ARCHIVE_VERIFICATION=PASS"

      - name: Publish small diagnostic receipt as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarguardian-retention-pilot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sarguardian-retention/curated/source-inventory.json
            ${{ runner.temp }}/sarguardian-retention/curated/preflight-report.json
            ${{ runner.temp }}/sarguardian-retention/curated/*retention-manifest.json
            ${{ runner.temp }}/sarguardian-retention/curated/reader-equivalence.json
            ${{ runner.temp }}/sarguardian-retention/curated/drive-retention-receipt.json
            ${{ runner.temp }}/sarguardian-retention/curated/drive-receipt-upload-receipt.json
            ${{ runner.temp }}/sarguardian-retention/raw/download-manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Final pilot status (raw source never explicitly deleted)
        if: always()
        shell: bash
        run: |
          echo "PILOT_SCOPE=ONE_GRANULE_ONLY"
          echo "AUTOMATIC_RAW_DELETION=DISABLED"
          echo "REAL_PRODUCT_AND_DRIVE_VALIDATION_REQUIRED_BEFORE_ANY_DELETION=YES"

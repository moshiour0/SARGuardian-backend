name: Know Place Generic AOI Live Measurement (consent bridge)

# Single-scene real-measurement verification for the generic polygon/date path.
# It is only enabled by an explicit [run-know-place] request-file commit.
# This workflow must be kept off main; the child handles GOFF identity, per-pair
# temporary-source cleanup, the interactive map, and derived-only Drive retention.
on:
  push:
    branches:
      - feat/know-place-analysis
    paths:
      - "docs/know-place/GENERIC_AOI_P05023_RUN_20261026.md"

permissions:
  contents: read

jobs:
  run-generic-aoi:
    if: contains(github.event.head_commit.message, '[run-know-place]')
    uses: ./.github/workflows/know-place-aoi-analysis.yml
    with:
      aoi_wkt: "POLYGON ((85.5245 28.2847, 85.5400 28.2847, 85.5400 28.2970, 85.5245 28.2970, 85.5245 28.2847))"
      start_date: "2026-06-20"
      end_date: "2026-08-31"
      hazard_mode: "ice_rock_avalanche"
      analysis_mode: "exploratory"
      geometry_height_m: "5151"
      coherence_neighbours: "1"
      polarization: "HH"
      track: "098"
      direction: "A"
      allowed_release_ids: "P05023"
      reference_wkt: "POLYGON ((85.500000 28.265000, 85.565000 28.265000, 85.565000 28.318000, 85.500000 28.318000, 85.500000 28.265000))"
      consent_marker: "[run-know-place]"
      execute_downloads: true
    secrets: inherit

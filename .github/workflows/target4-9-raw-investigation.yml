name: Target 4/9 raw NISAR scientific investigation

on:
  pull_request:
    paths:
      - ".github/workflows/target4-9-raw-investigation.yml"
      - "tools/download_nisar_product.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: target4-9-raw-investigation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout isolated backend investigation branch
        uses: actions/checkout@v4

      - name: Checkout isolated scientific audit branch
        uses: actions/checkout@v4
        with:
          repository: moshiour0/SARGuardian
          ref: science/valid-pixel-target4-9-audit
          path: scientific_engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install scientific and downloader dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r scientific_engine/requirements.txt

      - name: Run local synthetic regression gates
        run: python -m pytest scientific_engine/tests/test_target49_gate_diagnostic.py scientific_engine/tests/test_bound.py -q

      - name: Download and inspect exact Run 55 raw HDF5 products
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          OUTPUT="outputs/target49_raw_diagnostics"
          mkdir -p "$OUTPUT" data/target49_raw
          failures=0

          if [[ -z "${EARTHDATA_TOKEN:-}" && ( -z "${EARTHDATA_USERNAME:-}" || -z "${EARTHDATA_PASSWORD:-}" ) ]]; then
            python - "$OUTPUT/raw_download_status.json" <<'PY'
import json,sys
from datetime import datetime,timezone
from pathlib import Path
Path(sys.argv[1]).write_text(json.dumps({
  "status":"blocked_missing_earthdata_auth",
  "created_utc":datetime.now(timezone.utc).isoformat(),
  "raw_hdf5_downloaded":False,
  "needed":"Configure EARTHDATA_TOKEN or both EARTHDATA_USERNAME and EARTHDATA_PASSWORD as SARGuardian-backend Actions secrets."
},indent=2)+"\n")
PY
            echo "BLOCKED: Earthdata credentials are absent in this repo's Actions environment." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

          while IFS='|' read -r product maturity granule; do
            [[ -z "$granule" ]] && continue
            stem="${granule%.h5}"
            tempdir="data/target49_raw/$stem"
            mkdir -p "$tempdir"
            echo "::group::Download and inspect $granule"
            downloaded=0

            if python tools/download_nisar_product.py \
              --product-type "$product" \
              --maturity "$maturity" \
              --granule-name "$granule" \
              --science-root scientific_engine \
              --aoi source \
              --out-dir "$tempdir"; then
              raw="$tempdir/$granule"
              manifest="$tempdir/download-manifest.json"
              if [[ ! -s "$raw" || ! -s "$manifest" ]]; then
                echo "ERROR: expected raw granule or download receipt missing for $granule"
                failures=$((failures+1))
              else
                downloaded=1
                cp "$manifest" "$OUTPUT/${stem}_download.json"
                if python scientific_engine/tools/target49_gate_diagnostic.py "$raw" --aoi source --out "$OUTPUT/${stem}_source.json"; then
                  :
                else
                  failures=$((failures+1))
                  echo "ERROR: source-AOI diagnostic failed for $granule"
                fi
                if python scientific_engine/tools/target49_gate_diagnostic.py "$raw" --aoi langtang --out "$OUTPUT/${stem}_langtang.json"; then
                  :
                else
                  failures=$((failures+1))
                  echo "ERROR: Langtang-AOI diagnostic failed for $granule"
                fi
                python - "$OUTPUT/${stem}_download.json" "$raw" "$granule" <<'PY'
import json,sys
from pathlib import Path
p=Path(sys.argv[1]); d=json.loads(p.read_text())
d["diagnostic_granule_name"]=sys.argv[3]
d["raw_hdf5_kept_in_artifact"]=False
d["raw_hdf5_deletion_policy"]="delete runner-local raw product after source and langtang gate diagnostics"
p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
PY
              fi
            else
              failures=$((failures+1))
              python - "$OUTPUT/${stem}_download_failure.json" "$product" "$maturity" "$granule" <<'PY'
import json,sys
from datetime import datetime,timezone
from pathlib import Path
Path(sys.argv[1]).write_text(json.dumps({
  "status":"download_failed",
  "created_utc":datetime.now(timezone.utc).isoformat(),
  "product_type":sys.argv[2],"maturity":sys.argv[3],"granule":sys.argv[4],
  "raw_hdf5_downloaded":False,
  "detail":"See this GitHub Actions step log for redacted downloader diagnostics."
},indent=2)+"\n")
PY
            fi

            # Raw HDF5 is intentionally never uploaded as an Actions artifact.
            rm -rf "$tempdir"
            if [[ "$downloaded" -eq 1 ]]; then
              echo "DIAGNOSIS_ATTEMPTED $granule; raw HDF5 removed from runner workspace after processing"
            fi
            echo "::endgroup::"
          done <<'PRODUCTS'
GUNW|PROVISIONAL|NISAR_L2_PR_GUNW_024_098_A_016_025_4000_SH_20260702T233920_20260702T233955_20260714T233920_20260714T233954_P05023_F_F_J_001.h5
GUNW|PROVISIONAL|NISAR_L2_PR_GUNW_025_048_D_074_026_2000_SH_20260711T125814_20260711T125848_20260723T125813_20260723T125848_P05023_N_F_J_001.h5
GUNW|PROVISIONAL|NISAR_L2_PR_GUNW_025_098_A_016_026_4000_SH_20260714T233920_20260714T233954_20260726T233919_20260726T233954_P05023_N_F_J_001.h5
GUNW|PROVISIONAL|NISAR_L2_PR_GUNW_026_048_D_074_028_4000_SH_20260723T125813_20260723T125848_20260816T125812_20260816T125846_P05023_N_F_J_001.h5
GUNW|PROVISIONAL|NISAR_L2_PR_GUNW_026_098_A_016_028_4000_SH_20260726T233919_20260726T233954_20260819T233918_20260819T233953_P05023_N_F_J_001.h5
GOFF|PROVISIONAL|NISAR_L2_PR_GOFF_024_098_A_016_025_4000_SH_20260702T233920_20260702T233955_20260714T233920_20260714T233954_P05023_F_F_J_001.h5
GOFF|PROVISIONAL|NISAR_L2_PR_GOFF_025_048_D_074_026_2000_SH_20260711T125814_20260711T125848_20260723T125813_20260723T125848_P05023_N_F_J_001.h5
GOFF|PROVISIONAL|NISAR_L2_PR_GOFF_025_098_A_016_026_4000_SH_20260714T233920_20260714T233954_20260726T233919_20260726T233954_P05023_N_F_J_001.h5
GOFF|PROVISIONAL|NISAR_L2_PR_GOFF_026_048_D_074_028_4000_SH_20260723T125813_20260723T125848_20260816T125812_20260816T125846_P05023_N_F_J_001.h5
GOFF|PROVISIONAL|NISAR_L2_PR_GOFF_026_098_A_016_028_4000_SH_20260726T233919_20260726T233954_20260819T233918_20260819T233953_P05023_N_F_J_001.h5
PRODUCTS

          python - "$OUTPUT/raw_download_status.json" "$failures" <<'PY'
import json,sys,glob
from datetime import datetime,timezone
from pathlib import Path
out=Path(sys.argv[1]); failures=int(sys.argv[2])
files=glob.glob(str(out.parent/"*_source.json"))
status="completed" if failures==0 and len(files)==10 else "completed_with_errors"
out.write_text(json.dumps({
  "status":status,"created_utc":datetime.now(timezone.utc).isoformat(),
  "expected_products":10,"source_aoi_diagnostics_written":len(files),
  "error_count":failures,"raw_hdf5_in_artifact":False,
  "interpretation":"Raw gate counts are diagnostics; they are not by themselves proof of geophysical correctness."
},indent=2)+"\n")
PY
          echo "Raw-HDF5 diagnosis processed source/Langtang AOIs for $((10-failures)) success-count units; errors=$failures." | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$failures" -ne 0 ]]; then exit 1; fi

      - name: Upload diagnostic JSON and manifests only (never HDF5)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target4-9-raw-scientific-diagnostics
          path: outputs/target49_raw_diagnostics/
          if-no-files-found: error
          retention-days: 14

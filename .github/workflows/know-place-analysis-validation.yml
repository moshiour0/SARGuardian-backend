name: Know Place Analysis isolated validation

on:
  push:
    branches:
      - feat/know-place-analysis
    paths:
      - "tools/know_place/**"
      - "tools/tests/test_know_place_*.py"
      - ".github/workflows/know-place-analysis-validation.yml"
      - ".github/workflows/know-place-analysis-run.yml"
      - ".github/workflows/know-place-analysis-reanalysis.yml"
      - ".github/workflows/know-place-aoi-analysis.yml"
      - ".github/workflows/know-place-dem-source-acquisition.yml"
      - ".github/workflows/know-place-terrain-datum-sensitivity.yml"
      - ".github/workflows/know-place-author-exact-replay.yml"
      - ".github/workflows/sarguardian-aoi-wkt-dispatcher.yml"
      - "docs/KNOW_PLACE_ANALYSIS_*.md"
  pull_request:
    branches:
      - feat/final-aoi-science-integration
    paths:
      - "tools/know_place/**"
      - "tools/tests/test_know_place_*.py"
      - ".github/workflows/know-place-analysis-validation.yml"
      - ".github/workflows/know-place-analysis-run.yml"
      - ".github/workflows/know-place-analysis-reanalysis.yml"
      - ".github/workflows/know-place-aoi-analysis.yml"
      - ".github/workflows/know-place-author-exact-replay.yml"
      - ".github/workflows/sarguardian-aoi-wkt-dispatcher.yml"
      - "docs/KNOW_PLACE_ANALYSIS_*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: know-place-analysis-validation
  cancel-in-progress: false

jobs:
  pure-kernel-tests:
    name: Scientific kernel, HDF5 schema, geometry and workflow tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated Know Place Analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install test/runtime requirements
        run: python -m pip install --disable-pip-version-check numpy pytest h5py scipy pyproj pyyaml rasterio affine

      - name: Compile every isolated analysis and datum-sensitivity module
        run: python -m py_compile tools/know_place/paper_method.py tools/know_place/goff_io.py tools/know_place/geometry.py tools/know_place/analyze.py tools/know_place/catalog.py tools/know_place/reanalyse_saved_arrays.py tools/know_place/aoi_request.py tools/know_place/series.py tools/know_place/aoi_runner.py tools/know_place/dashboard.py tools/know_place/uncertainty.py tools/know_place/upload_bundle_to_drive.py tools/know_place/event_validation.py tools/know_place/select_threshold.py tools/know_place/motion_features.py tools/know_place/author_catalog.py tools/know_place/author_parity.py tools/know_place/verify_author_fields.py tools/know_place/footprint_screen.py tools/know_place/footprint_geometry.py tools/know_place/terrain_vertical_datum.py tools/know_place/author_exact_acquisition.py tools/know_place/author_exact_retention.py tools/know_place/author_raw_site_series.py tools/know_place/author_archive_raster_parity.py tools/know_place/author_footprint_replay.py tools/know_place/scientific_status.py

      - name: Parse all eight Know Place workflows and the branch Run Workflow launcher as YAML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = [
              Path(".github/workflows/know-place-analysis-validation.yml"),
              Path(".github/workflows/know-place-analysis-run.yml"),
              Path(".github/workflows/know-place-analysis-reanalysis.yml"),
              Path(".github/workflows/know-place-aoi-analysis.yml"),
              Path(".github/workflows/know-place-dem-source-acquisition.yml"),
              Path(".github/workflows/know-place-terrain-datum-sensitivity.yml"),
              Path(".github/workflows/know-place-author-exact-replay.yml"),
              Path(".github/workflows/sarguardian-aoi-wkt-dispatcher.yml"),
          ]
          for path in paths:
              with path.open(encoding="utf-8") as stream:
                  yaml.compose(stream, Loader=yaml.BaseLoader)
              print(f"WORKFLOW_YAML_SYNTAX_PASS={path}")
          PY

      - name: Run scientific known-answer, raw-reader, geometry, catalog and integration tests
        run: >-
          python -m pytest -q --confcutdir=tools/tests
          tools/tests/test_know_place_paper_method.py
          tools/tests/test_know_place_goff_io.py
          tools/tests/test_know_place_geometry.py
          tools/tests/test_know_place_catalog.py
          tools/tests/test_know_place_analyze.py
          tools/tests/test_know_place_reanalyse_saved_arrays.py
          tools/tests/test_know_place_aoi_request.py
          tools/tests/test_know_place_series.py
          tools/tests/test_know_place_aoi_runner.py
          tools/tests/test_know_place_aoi_runner_integration.py
          tools/tests/test_know_place_geotiff.py
          tools/tests/test_know_place_dashboard.py
          tools/tests/test_know_place_uncertainty.py
          tools/tests/test_know_place_upload_bundle.py
          tools/tests/test_know_place_event_validation.py
          tools/tests/test_know_place_motion_features.py
          tools/tests/test_know_place_author_reference_data.py
          tools/tests/test_know_place_author_catalog.py
          tools/tests/test_know_place_author_archive.py
          tools/tests/test_know_place_author_parity.py
          tools/tests/test_know_place_author_fields_verifier.py
          tools/tests/test_know_place_footprint_screen.py tools/tests/test_know_place_footprint_geometry.py tools/tests/test_know_place_terrain_vertical_datum.py
          tools/tests/test_know_place_author_exact_acquisition.py
          tools/tests/test_know_place_author_exact_retention.py
          tools/tests/test_know_place_multisite_benchmark.py
          tools/tests/test_know_place_author_raw_site_series.py tools/tests/test_know_place_author_archive_raster_parity.py tools/tests/test_know_place_author_footprint_replay.py tools/tests/test_know_place_scientific_status.py

      - name: Install pinned actionlint binary and verify its checksum
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version

      - name: Run semantic GitHub Actions workflow validation
        run: /tmp/actionlint .github/workflows/know-place-analysis-validation.yml .github/workflows/know-place-analysis-run.yml .github/workflows/know-place-analysis-reanalysis.yml .github/workflows/know-place-aoi-analysis.yml .github/workflows/know-place-dem-source-acquisition.yml .github/workflows/know-place-terrain-datum-sensitivity.yml .github/workflows/know-place-author-exact-replay.yml .github/workflows/sarguardian-aoi-wkt-dispatcher.yml

  live-asf-catalog-contract:
    name: Live ASF identity gates for historical and author-exact granules (no downloads)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Know Place Analysis branch
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install pinned catalog-only dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.4.6 h5py==3.16.0 asf_search==13.0.0

      - name: Query ASF for the five exact candidate granules without downloading them
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.know_place.catalog --out "${{ runner.temp }}/know-place-catalog-manifest.json"
          python - "${{ runner.temp }}/know-place-catalog-manifest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          rows=d.get("products",[])
          if d.get("status")!="PASS" or len(rows)!=5:
              raise SystemExit("ERROR=ASF_CATALOG_NOT_FIVE_EXACT_PRODUCTS")
          for p in rows:
              print("ASF_CATALOG_IDENTITY=PASS {} {}->{} {} {}".format(
                  p["previous_product_id"],p["reference_date"],p["secondary_date"],
                  p["release_id"],p["catalog_maturity"]))
          print("RAW_PRODUCT_DOWNLOADS=0")
          PY

      - name: Preserve live historical catalog evidence
        uses: actions/upload-artifact@v4
        with:
          name: know-place-live-asf-catalog-evidence
          path: ${{ runner.temp }}/know-place-catalog-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Query the five exact author-published P05023 products without downloading them
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.know_place.author_catalog --out "${{ runner.temp }}/know-place-author-catalog-manifest.json"
          python - "${{ runner.temp }}/know-place-author-catalog-manifest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          rows=d.get("products",[])
          if d.get("status") not in {"PASS","BLOCKED"} or len(rows)!=5:
              raise SystemExit("ERROR=ASF_AUTHOR_CATALOG_MANIFEST_INVALID")
          if any(p.get("release_id")!="P05023" or p.get("source_sha256") is not None for p in rows):
              raise SystemExit("ERROR=ASF_AUTHOR_IDENTITY_GATE_SCHEMA_CONFLICT")
          for p in rows:
              print("ASF_AUTHOR_PRODUCT_IDENTITY={} {} {} {}".format(
                  p["catalog_identity_status"],p["interval"],p["release_id"],
                  p.get("catalog_maturity") or "UNRESOLVED"))
          print("AUTHOR_CATALOG_IDENTITY_GATE={}".format(
              "PASS" if d.get("status")=="PASS" else "BLOCKED"))
          print("RAW_SOURCE_BYTE_IDENTITY=UNVERIFIED")
          print("AUTHOR_SOURCE_SHA256_COUNT={}".format(
              sum(p.get("source_sha256") is not None for p in rows)))
          print("PAPER_REPRODUCTION_STATUS=BLOCKED_RAW_GOFF_BYTES_AND_IMPLEMENTATION_PARITY_UNVERIFIED")
          print("HAZARD_DETECTION_STATUS=NOT_EVALUATED")
          print("SOURCE_DOWNLOADS=0")
          PY

      - name: Preserve live author-identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: know-place-author-live-asf-catalog-evidence
          path: ${{ runner.temp }}/know-place-author-catalog-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Resolve all five author-exact CMR HTTP data links without downloading payloads
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.know_place.author_exact_acquisition --operation catalog --out-root "${{ runner.temp }}/know-place-author-exact-catalog"
          python - "${{ runner.temp }}/know-place-author-exact-catalog/author-exact-catalog-manifest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          rows=d.get("products",[])
          if d.get("status")!="PASS" or len(rows)!=5 or d.get("exact_cmr_confirmed_count")!=5:
              raise SystemExit("ERROR=AUTHOR_EXACT_CMR_ACCESS_CATALOG_NOT_FIVE")
          if d.get("source_downloads")!=0 or any(p.get("source_sha256") is not None for p in rows):
              raise SystemExit("ERROR=CMR_CATALOG_STEP_MUST_NOT_DOWNLOAD_OR_INVENT_SOURCE_HASHES")
          if any(p.get("release_id")!="P05023" or not p.get("exact_data_url") for p in rows):
              raise SystemExit("ERROR=AUTHOR_EXACT_P05023_DATA_URL_MISSING")
          print("AUTHOR_EXACT_CMR_DATA_URLS_CONFIRMED=5")
          print("SOURCE_DOWNLOADS=0")
          print("PAPER_REPRODUCTION_STATUS=BLOCKED_RAW_GOFF_BYTES_AND_IMPLEMENTATION_PARITY_UNVERIFIED")
          PY

      - name: Preserve exact-author CMR access evidence
        uses: actions/upload-artifact@v4
        with:
          name: know-place-author-exact-live-cmr-access-evidence
          path: ${{ runner.temp }}/know-place-author-exact-catalog/author-exact-catalog-manifest.json
          if-no-files-found: error
          retention-days: 14

name: SARGuardian retention and streaming regression tests

on:
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements*.txt"
  push:
    branches:
      - main
      - feat/streaming-science-pipeline
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements*.txt"

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend and data-retention test dependencies without pip cache
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-dev.txt
          python -m pip install --disable-pip-version-check --no-cache-dir -r tools/requirements-retention.txt
      - name: Compile Python tools and tests
        run: python -m compileall -q tools tests
      - name: Run repository regression suite
        run: python -m pytest -q
      - name: Check workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path); puts "YAML_PARSE_PASS=#{path}" }' \
            .github/workflows/sarguardian-retention-pilot.yml \
            .github/workflows/sarguardian-streaming-batch.yml \
            .github/workflows/sarguardian-live-validation.yml \
            .github/workflows/sarguardian-retention-ci.yml
